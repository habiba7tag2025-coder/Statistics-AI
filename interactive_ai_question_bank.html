        // App State
        let currentFilter = 'all';
        let userAnswers = {}; // Map of questionId -> selectedOptionIndex

        // DOM Elements
        const questionContainer = document.getElementById('questionContainer');
        const chapterFilterBtns = document.querySelectorAll('.filter-btn');
        const scoreCounterEl = document.getElementById('scoreCounter');
        const remainingCounterEl = document.getElementById('remainingCounter');
        const progressBarEl = document.getElementById('progressBar');
        const progressPercentEl = document.getElementById('progressPercent');
        const completionSummaryEl = document.getElementById('completionSummary');
        const resetQuizBtn = document.getElementById('resetQuizBtn');
        const restartQuizBtn = document.getElementById('restartQuizBtn');

        // Filter Logic
        chapterFilterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                chapterFilterBtns.forEach(b => {
                    b.classList.remove('active', 'bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/50', 'shadow-neon-cyan');
                    b.classList.add('bg-slate-800', 'text-slate-400', 'border-slate-700');
                });
                btn.classList.add('active', 'bg-cyan-500/20', 'text-cyan-300', 'border-cyan-500/50', 'shadow-neon-cyan');
                btn.classList.remove('bg-slate-800', 'text-slate-400', 'border-slate-700');

                currentFilter = btn.getAttribute('data-chapter');
                renderQuiz();
            });
        });

        // Initialize & Render Quiz
        function renderQuiz() {
            const filteredQuestions = getFilteredQuestions();
            questionContainer.innerHTML = '';

            if (filteredQuestions.length === 0) {
                questionContainer.innerHTML = `<div class="text-center py-12 text-slate-500">لا توجد أسئلة متوفرة لهذا الفصل حالياً.</div>`;
                return;
            }

            filteredQuestions.forEach((q, index) => {
                const isAnswered = userAnswers.hasOwnProperty(q.id);
                const selectedOption = userAnswers[q.id];
                const isCorrect = isAnswered && selectedOption === q.correctAnswer;

                const qCard = document.createElement('div');
                qCard.className = `glass-panel rounded-2xl p-6 border transition duration-300 ${
                    isAnswered 
                        ? (isCorrect ? 'border-emerald-500/40 shadow-neon-emerald' : 'border-pink-500/40 shadow-neon-pink')
                        : 'border-slate-800 hover:border-slate-700'
                }`;

                // Options HTML
                let optionsHTML = '';
                q.options.forEach((opt, optIdx) => {
                    let optionStyle = "bg-slate-900/60 border-slate-800 text-slate-300 hover:bg-slate-800 hover:border-cyan-500/40";
                    let badgeHTML = '';

                    if (isAnswered) {
                        if (optIdx === q.correctAnswer) {
                            optionStyle = "bg-emerald-950/60 border-emerald-500 text-emerald-200 shadow-neon-emerald font-semibold";
                            badgeHTML = `<span class="mr-auto text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/40"><i class="fa-solid fa-check ml-1"></i> الإجابة الصحيحة</span>`;
                        } else if (optIdx === selectedOption) {
                            optionStyle = "bg-pink-950/60 border-pink-500 text-pink-200 shadow-neon-pink";
                            badgeHTML = `<span class="mr-auto text-xs px-2 py-0.5 rounded bg-pink-500/20 text-pink-400 border border-pink-500/40"><i class="fa-solid fa-xmark ml-1"></i> اختيارك الخاطئ</span>`;
                        } else {
                            optionStyle = "bg-slate-900/30 border-slate-900 text-slate-600 opacity-50";
                        }
                    }

                    optionsHTML += `
                        <button 
                            onclick="selectAnswer(${q.id}, ${optIdx})" 
                            ${isAnswered ? 'disabled' : ''} 
                            class="w-full text-right p-4 rounded-xl border transition-all duration-200 flex items-center gap-3 ${optionStyle}">
                            <span class="w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs font-mono">
                                ${String.fromCharCode(65 + optIdx)}
                            </span>
                            <span class="text-sm font-medium leading-relaxed">${opt}</span>
                            ${badgeHTML}
                        </button>
                    `;
                });

                // Explanation Box HTML
                let explanationHTML = '';
                if (isAnswered) {
                    explanationHTML = `
                        <div class="mt-5 p-4 rounded-xl text-sm leading-relaxed border ${
                            isCorrect 
                                ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300' 
                                : 'bg-slate-900/90 border-pink-500/30 text-slate-200'
                        }">
                            <div class="flex items-center gap-2 font-bold mb-2 ${isCorrect ? 'text-emerald-400' : 'text-pink-400'}">
                                <i class="fa-solid ${isCorrect ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i>
                                ${isCorrect ? 'تفسير الإجابة الصحيحة:' : 'لماذا خطأ وما هي الإجابة الصحيحة؟'}
                            </div>
                            <p class="text-xs md:text-sm text-slate-300">
                                ${isCorrect ? q.explanations.correct : q.explanations.incorrect}
                            </p>
                        </div>
                    `;
                }

                qCard.innerHTML = `
                    <div class="flex justify-between items-center gap-2 mb-3">
                        <span class="text-xs px-2.5 py-1 rounded-md bg-purple-950/60 border border-purple-800/50 text-purple-300 font-mono">
                            ${q.chapterTitle}
                        </span>
                        <span class="text-xs text-slate-500 font-mono">Question #${index + 1}</span>
                    </div>
                    <h3 class="text-base md:text-lg font-bold text-slate-100 mb-5 leading-snug dir-ltr text-left">
                        ${q.question}
                    </h3>
                    <div class="space-y-3 dir-ltr">
                        ${optionsHTML}
                    </div>
                    ${explanationHTML}
                `;

                questionContainer.appendChild(qCard);
            });

            updateProgress();
        }

        // Filter Helper
        function getFilteredQuestions() {
            if (currentFilter === 'all') return quizQuestions;
            return quizQuestions.filter(q => q.chapter === parseInt(currentFilter));
        }

        // Answer Handling Action
        window.selectAnswer = function(questionId, selectedIdx) {
            if (userAnswers.hasOwnProperty(questionId)) return;
            
            userAnswers[questionId] = selectedIdx;
            renderQuiz();
        };

        // Update Stats & Progress Calculation
        function updateProgress() {
            const filteredQuestions = getFilteredQuestions();
            const totalCount = filteredQuestions.length;
            
            let answeredCount = 0;
            let correctCount = 0;

            filteredQuestions.forEach(q => {
                if (userAnswers.hasOwnProperty(q.id)) {
                    answeredCount++;
                    if (userAnswers[q.id] === q.correctAnswer) {
                        correctCount++;
                    }
                }
            });

            const remainingCount = totalCount - answeredCount;
            const percentage = totalCount > 0 ? Math.round((answeredCount / totalCount) * 100) : 0;

            scoreCounterEl.textContent = `${correctCount}/${answeredCount}`;
            remainingCounterEl.textContent = remainingCount;
            progressBarEl.style.width = `${percentage}%`;
            progressPercentEl.textContent = `${percentage}%`;

            // Check if user completed all questions in current view
            if (totalCount > 0 && answeredCount === totalCount) {
                showCompletionSummary(correctCount, totalCount);
            } else {
                completionSummaryEl.classList.add('hidden');
            }
        }

        // Final Summary Display
        function showCompletionSummary(correct, total) {
            const percentage = Math.round((correct / total) * 100);
            
            document.getElementById('finalScoreText').textContent = `${correct} / ${total}`;
            document.getElementById('finalPercentageText').textContent = `${percentage}%`;
            
            const gradeEl = document.getElementById('finalGradeText');
            if (percentage >= 90) {
                gradeEl.textContent = "ممتاز مرتفع (Excellent)";
                gradeEl.className = "text-base font-bold text-emerald-400 mt-1";
            } else if (percentage >= 75) {
                gradeEl.textContent = "جيد جداً (Very Good)";
                gradeEl.className = "text-base font-bold text-cyan-400 mt-1";
            } else if (percentage >= 60) {
                gradeEl.textContent = "جيد (Good)";
                gradeEl.className = "text-base font-bold text-yellow-400 mt-1";
            } else {
                gradeEl.textContent = "يحتاج إلى مراجعة (Needs Review)";
                gradeEl.className = "text-base font-bold text-pink-400 mt-1";
            }

            completionSummaryEl.classList.remove('hidden');
        }

        // Reset App State
        function resetQuiz() {
            userAnswers = {};
            completionSummaryEl.classList.add('hidden');
            renderQuiz();
        }

        resetQuizBtn.addEventListener('click', resetQuiz);
        restartQuizBtn.addEventListener('click', resetQuiz);

        // App Launch
        renderQuiz();
    </script>
</body>
</html>
